name: Update

on:
  schedule:
    # Every hour. Polls are read on every run; the economic series when a release could be out (update.py, economy_due).
    # If nothing the model reads has changed, the run ends there and nothing is saved.
    # GitHub starts scheduled runs late, sometimes by a good while, so the minute is only a rough one.
    - cron: "7 * * * *"
  repository_dispatch:
    # "check now", from an outside scheduler (see The Margin's RUNBOOK.md). Treated exactly as a scheduled run.
    types: [heartbeat]
  workflow_dispatch:
    inputs:
      trust:
        description: "Series to accept even though they failed a check, separated by spaces (after looking at them)"
        required: false
        default: ""
      check:
        description: "Run as the hourly check does: stop if nothing is new"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # The branch as it stands when the run starts, not as it stood when the run was asked for: a run that waited
      # behind another one must start from what that one saved.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy markdown openpyxl

      - name: Check the locked model, the update checks and the run-ahead
        run: |
          python tests/test_model.py
          python tests/test_update.py
          python tests/test_engine.py
          python tests/test_calls.py
          python tests/test_outlook.py

      - name: Read the sources, check them, and rerun 2028 if anything is new
        id: update
        continue-on-error: true
        timeout-minutes: 25
        env:
          TRUST: ${{ inputs.trust }}
          CHECK: ${{ inputs.check }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}      # optional: without it FRED is read through its download links
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$CHECK" != "true" ]; then
            python update.py --force --trust "$TRUST"
          else
            python update.py
          fi

      - name: Save to the repository
        id: save
        if: steps.update.outputs.changed == 'true'
        env:
          WHAT: ${{ steps.update.outputs.what }}
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data projection_2028.json archive docs
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update $(TZ=America/New_York date '+%Y-%m-%d %H:%M'): $WHAT"
            # Runs are made one at a time, so a push is refused only if somebody else pushed meanwhile. Generated
            # files cannot be merged: this run's result is dropped, and the next run starts from the new state.
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::The repository changed while this run was working. Its result was not saved; the next run starts from the new state."
            fi
          fi

      # The Margin reads this site's count. With a DISPATCH_TOKEN secret it is told at once; without one it finds the
      # change at its own next hourly check.
      - name: Tell The Margin
        if: steps.save.outputs.pushed == 'true' && steps.update.outputs.feed == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "No DISPATCH_TOKEN secret: The Margin will see the new count at its next hourly check."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KA82205/the-margin/dispatches \
            -d '{"event_type":"upstream-updated","client_payload":{"from":"fifty-two-keys"}}' \
            || echo "::warning::The Margin could not be told; its hourly check will pick the change up."

      # The Margin also runs on its own schedule, but GitHub starts scheduled runs when it pleases. Every run here that finds
      # The Margin has not checked for most of an hour wakes it. The Margin never wakes this site back, so there is no loop.
      - name: Wake The Margin if it has not checked lately
        if: always()
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then exit 0; fi
          mins=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/KA82205/the-margin/actions/workflows/update.yml/runs?per_page=1" \
            | python3 -c "import sys,json,datetime as d; r=json.load(sys.stdin)['workflow_runs']; print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(r[0]['created_at'].replace('Z','+00:00'))).total_seconds()//60) if r else 9999)" || echo 0)
          echo "The Margin last started a run $mins minutes ago."
          if [ "$mins" -ge 50 ]; then
            curl -fsS -X POST -H "Authorization: Bearer $DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/KA82205/the-margin/dispatches -d '{"event_type":"heartbeat","client_payload":{"from":"fifty-two-keys"}}' \
              && echo "Woke The Margin." || echo "::warning::The Margin could not be woken."
          fi

      # A figure held back, or a source out of reach for days, is always flagged (update.py reports each at once and
      # then once a day). A run that fails for another reason is tried again every hour and marked as failed at 7 a.m.,
      # 1 p.m. and 7 p.m. Eastern only, so a fault that lasts is reported three times a day and a passing one not at all.
      # A run started by hand is always marked.
      - name: Flag figures that were held back, or a failed run
        if: steps.update.outcome == 'failure'
        env:
          ALERT: ${{ steps.update.outputs.alert }}
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "$ALERT" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "07" ] || [ "$hour" = "13" ] || [ "$hour" = "19" ]; then
            echo "::error::Some figures were not updated, a source has been out of reach for days, or the run failed. The page shows the last good figures. Open the update step above."
            exit 1
          fi
          echo "::warning::The run failed this hour; the page shows the last good figures. The next hourly run tries again."
