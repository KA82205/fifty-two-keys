name: Nomination sources check
# Reads the nomination sources as they stand today for three past elections and for 2028, and prints what the reader makes
# of them. Started by hand; it changes nothing. A way to see that the pages are still laid out the way primaries.py expects.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          for pair in "2016 D" "2020 R" "2024 D" "2028 R"; do echo "==== $pair"; python primaries.py $pair; sleep 3; done
