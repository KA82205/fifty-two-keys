<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Methodology audit | {{TITLE}}</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Besley";font-style:normal;font-weight:400 900;font-display:swap;src:url(data:font/woff2;base64,{{FONT_DISPLAY}}) format("woff2")}
@font-face{font-family:"Libre Franklin";font-style:normal;font-weight:100 900;font-display:swap;src:url(data:font/woff2;base64,{{FONT_TEXT}}) format("woff2")}
:root{--paper:#f5f6f1;--ink:#17211b;--muted:#56635b;--line:#d2d8cf;--board:#1f3d31;--brass-ink:#8a660d}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 "Libre Franklin",system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-underline-offset:3px}
.top{background:var(--board);color:#eef2e6}
.top div{max-width:820px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.92rem}
.top a{text-decoration:none;font-weight:600}
main{max-width:820px;margin:0 auto;padding:40px 20px 96px}
h1,h2{font-family:"Besley",Georgia,serif;font-weight:700;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5vw,2.8rem);margin:0 0 12px}
h2{font-size:1.5rem;margin:56px 0 12px;padding-top:18px;border-top:2px solid var(--ink)}
p,li{max-width:70ch}
li{margin:6px 0}
ol,ul{padding-left:22px}
code{font:500 .88em ui-monospace,SFMono-Regular,Menlo,monospace;background:#e9ece3;padding:1px 5px;border-radius:3px}
pre{background:#e9ece3;padding:14px 16px;overflow-x:auto;border-radius:4px}
pre code{background:none;padding:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem;margin:18px 0 22px;font-variant-numeric:tabular-nums}
th,td{text-align:left;vertical-align:top;padding:9px 14px 9px 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);border-bottom:2px solid var(--ink);font-size:.86rem}
td:last-child,th:last-child{padding-right:0}
</style>
</head>
<body>
<div class="top"><div><a href="./">{{TITLE}}</a><a href="./#research">Back to the research section</a></div></div>
<main>
{{BODY}}
</main>
<script>document.querySelectorAll('main table').forEach(t => { const d = document.createElement('div'); d.className = 'scroll'; t.parentNode.insertBefore(d, t); d.appendChild(t); });</script>
</body>
</html>
